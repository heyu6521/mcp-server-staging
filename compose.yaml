services:
  mcp:
    build: .
    image: git-readwrite-mcp:local
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    env_file: [.env]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/repositories.yaml:/run/config/repositories.yaml:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz',{headers:{authorization:'Bearer '+process.env.BEARER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
